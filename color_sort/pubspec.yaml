name: color_sort
description: "Everpuzz 1本目(色ソート)のルール・面生成・検証。UI(Flutter)は別途この上に載せる。"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  puzzle_core:
    git:
      url: https://github.com/zka32101/puzzle_core.git
      ref: 8a551d189735581dcf922eaacd470061880cb604 # puzzle_core の固定版(コミット。タグを打ったらタグに置き換えてよい)

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Flutter アプリから packages/color_sort/... で読めるようにする(純Dart側は無視する)
flutter:
  assets:
    - assets/levels/
    - assets/town/
    - assets/art/
