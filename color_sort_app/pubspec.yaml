name: color_sort_app
description: "Everpuzz Village 色ソート — Flutterアプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  color_sort:
    path: ../color_sort
  puzzle_core:
    git:
      url: https://github.com/zka32101/puzzle_core.git
      ref: 2c06cca63ed4a90ad930c1c3fe4575f9807f0494 # puzzle_core の固定版(コミット。タグを打ったらタグに置き換えてよい)
  shared_preferences: ^2.3.0
  purchases_flutter: ^10.17.0
  google_mobile_ads: ^9.1.0
  share_plus: ^13.3.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/shop/products.json
    - assets/sfx/

# アプリアイコン(`dart run flutter_launcher_icons` で ios/ android/ に書き出す)。
# 元画像は台帳の app_icon(1024・不透明)。
flutter_launcher_icons:
  image_path: "../color_sort/assets/art/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Androidのアダプティブアイコン(前景と背景を分ける)。前景は中心から半径約66%の円の内側に収めてある。
  adaptive_icon_background: "../color_sort/assets/art/app_icon_bg.png"
  adaptive_icon_foreground: "../color_sort/assets/art/app_icon_fg.png"
  # 前景は、安全域(円形に切られても欠けない範囲)に収めて作ってあるので、ツールの追加の余白(既定16%)は0にする。
  adaptive_icon_foreground_inset: 0

# shared_preferences_android 2.5.0 は、リリースビルドで起動時に NoSuchMethodError となり、画面が白いまま止まる(実機で確認)。
# うかラボのアプリと同じ 2.4.x に固定する。
dependency_overrides:
  shared_preferences_android: 2.4.23
